<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Car List</title>
    <style>
        table{
            width: 50%;
            border-collapse: collapse;
            margin: 20px 0;
        }
th,td {
    border: 1px solid #dddddd;
    text-align: left;
    padding: 8px;
}
th{
    background-color: #f2f2f2;
}
    </style>
</head>
<body>

<h2>List of Cars</h2>

<table>
    <thead>
    <tr>
        <th>Model</th>
        <th>Series</th>
        <th>Year</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="car : ${cars}">
        <td th:text="${car.model}">Model</td>
        <td th:text="${car.series}">Series</td>
        <td th:text="${car.year}">Year</td>
    </tr>
    </tbody>
</table>
</body>
</html>
